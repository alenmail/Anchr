name: Build Anchr Windows
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/anchr-desktop-and-plugin

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout application and Chrrxs source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Anchr desktop icons
        run: pnpm icons:anchr
      - name: Bundle MCP server and compile Anchr Studio plugin
        run: pnpm stage:anchr-mcp
      - name: Verify MCP handshake and Chrrxs tools
        run: node scripts/smoke-anchr-mcp.mjs
      - name: Typecheck Electron main process
        run: pnpm exec tsc -p electron/tsconfig.json --noEmit
      - name: Build Electron and React
        run: pnpm build
      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never
      - name: Upload Anchr installer
        uses: actions/upload-artifact@v4
        with:
          name: Anchr-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
