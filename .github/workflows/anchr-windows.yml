name: Build Anchr Windows
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/anchr-desktop-and-plugin
      - feature/anchr-v0.1.4-assistant-workflows

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout application and Chrrxs source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Python for branded icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Anchr desktop icons
        run: pnpm icons:anchr
      - name: Bundle MCP server and compile Anchr Studio plugin
        env:
          ANCHR_STUDIO_ICON_ASSET_ID: ${{ vars.ANCHR_STUDIO_ICON_ASSET_ID }}
        run: pnpm stage:anchr-mcp
      - name: Verify MCP handshake and Chrrxs tools
        run: node scripts/smoke-anchr-mcp.mjs
      - name: Typecheck Electron main process
        run: pnpm exec tsc -p electron/tsconfig.json --noEmit
      - name: Typecheck Anchr UI
        run: pnpm exec tsc --noEmit
      - name: Build Electron and React
        run: pnpm build
      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never
      - name: Verify beta auto-update manifest
        shell: pwsh
        run: |
          if (!(Test-Path "release/beta.yml")) { throw "Missing beta.yml — in-app updates would fail" }
          if (!(Test-Path "release/*.exe.blockmap")) { throw "Missing differential update blockmap" }
      - name: Upload Anchr installer
        uses: actions/upload-artifact@v4
        with:
          name: Anchr-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned development release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4-beta.2
          name: Anchr v0.1.4 (beta 2)
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          body: |
            Anchr v0.1.4 beta 2: clarifies vision setup for text-only models and removes remaining inherited thinking-component naming.
            This is an unsigned prerelease. Install only if you trust the project.
            Live Roblox Studio integration still requires testing.
          files: |
            release/*.exe
            release/beta.yml
            release/latest.yml
            release/*.exe.blockmap
            assets/anchr-studio-toolbar.png
